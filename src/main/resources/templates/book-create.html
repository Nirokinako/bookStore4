<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>書籍の新規作成</title>
<!-- Bootstrap 本体とアイコン（CDN） -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
	/* ページ全体の背景：薄いグレー */
	body {
		background-color: #f0f0f0;
	}
	/* メイン部分：最大700px・中央揃え・左右50pxの余白 */
	.main-area {
		max-width: 700px;
		margin: 0 auto;
		padding: 30px 50px;
	}
</style>
</head>
<body>

	<!-- ナビゲーションバー -->
	<nav class="navbar navbar-dark bg-primary mb-4">
		<div class="container">
			<a class="navbar-brand" th:href="@{/book/list}">
				<i class="bi bi-book"></i> Bookstore
			</a>
		</div>
	</nav>

	<div class="main-area">

		<h1 class="h3 mb-3">書籍データの新規作成</h1>

		<div class="card shadow-sm">
			<div class="card-body p-4">

				<form th:action="@{/book/create}" method="post" th:object="${bookForm}" novalidate>

					<!-- 題名 -->
					<div class="row mb-3">
						<label th:for="title" class="col-sm-2 col-form-label">題名</label>
						<div class="col-sm-10">
							<input type="text" th:field="*{title}" class="form-control"
								   th:errorclass="is-invalid" placeholder="例：情報論理">
							<div class="invalid-feedback" th:errors="*{title}">エラーメッセージ</div>
						</div>
					</div>

					<!-- 発行日 -->
					<div class="row mb-3">
						<label th:for="date" class="col-sm-2 col-form-label">発行日</label>
						<div class="col-sm-3">
							<input type="date" th:field="*{date}" class="form-control"
								   th:errorclass="is-invalid">
							<div class="invalid-feedback" th:errors="*{date}">エラーメッセージ</div>
						</div>
					</div>

					<!-- 価格 -->
					<div class="row mb-3">
						<label th:for="price" class="col-sm-2 col-form-label">価格</label>
						<div class="col-sm-3">
							<div class="input-group has-validation">
								<input type="number" th:field="*{price}" class="form-control"
									   th:errorclass="is-invalid" placeholder="例：3500">
								<span class="input-group-text">円</span>
								<div class="invalid-feedback" th:errors="*{price}">エラーメッセージ</div>
							</div>
						</div>
					</div>

					<!-- メディアタイプ（チェックボックスは横並び） -->
					<div class="row mb-4">
						<div class="col-sm-2 col-form-label pt-0">メディアタイプ</div>
						<div class="col-sm-10">
							<div class="form-check form-check-inline">
								<input type="checkbox" th:field="*{mediaType}" value="印刷本" class="form-check-input">
								<label class="form-check-label" th:for="${#ids.prev('mediaType')}">印刷本</label>
							</div>
							<div class="form-check form-check-inline">
								<input type="checkbox" th:field="*{mediaType}" value="電子書籍" class="form-check-input">
								<label class="form-check-label" th:for="${#ids.prev('mediaType')}">電子書籍</label>
							</div>
							<div class="form-check form-check-inline">
								<input type="checkbox" th:field="*{mediaType}" value="オーディオブック" class="form-check-input">
								<label class="form-check-label" th:for="${#ids.prev('mediaType')}">オーディオブック</label>
							</div>
							<div class="text-danger small mt-1"
								 th:if="${#fields.hasErrors('mediaType')}" th:errors="*{mediaType}">エラーメッセージ</div>
						</div>
					</div>

					<!-- ボタン -->
					<div class="d-flex justify-content-end gap-2">
						<button type="submit" class="btn btn-primary">
							<i class="bi bi-plus-lg"></i> 新規作成
						</button>
						<a th:href="@{/book/list}" class="btn btn-outline-secondary">
							<i class="bi bi-x-lg"></i> キャンセル
						</a>
					</div>

				</form>

			</div>
		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
