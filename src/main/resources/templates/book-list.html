<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>書籍リスト</title>
<!-- Bootstrap 本体とアイコン（CDN） -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

	<!-- ナビゲーションバー -->
	<nav class="navbar navbar-dark bg-primary mb-4">
		<div class="container">
			<a class="navbar-brand" th:href="@{/book/list}">
				<i class="bi bi-book"></i> Bookstore
			</a>
		</div>
	</nav>

	<div class="container">

		<!-- 見出しと新規作成ボタン -->
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h1 class="h3 mb-0">書籍リスト</h1>
			<a th:href="@{/book/create}" class="btn btn-primary">
				<i class="bi bi-plus-lg"></i> 新規作成
			</a>
		</div>

		<div class="card shadow-sm">
			<div class="card-body p-0">

				<!-- データがないとき -->
				<div th:if="${#lists.isEmpty(books)}" class="text-center text-muted py-5">
					登録されている書籍はありません
				</div>

				<!-- 書籍一覧 -->
				<div class="table-responsive" th:unless="${#lists.isEmpty(books)}">
					<table class="table table-striped table-hover align-middle mb-0">
						<thead class="table-dark">
							<tr>
								<th scope="col">ID</th>
								<th scope="col">題名</th>
								<th scope="col">発行日</th>
								<th scope="col" class="text-end">価格</th>
								<th scope="col">メディアタイプ</th>
								<th scope="col" class="text-center">操作</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="book : ${books}">
								<td th:text="${book.id}">1</td>
								<td class="fw-semibold" th:text="${book.title}">情報論理</td>
								<td th:text="${#temporals.format(book.date, 'yyyy/MM/dd')}">2035/03/10</td>
								<td class="text-end"
									th:text="${#numbers.formatInteger(book.price, 1, 'COMMA')} + ' 円'">3,000 円</td>
								<td>
									<span th:each="type : ${book.mediaType}"
										  class="badge rounded-pill text-bg-secondary me-1"
										  th:text="${type}">印刷本</span>
								</td>
								<td class="text-center text-nowrap">
									<a th:href="@{/book/{id}/edit(id=${book.id})}"
									   class="btn btn-sm btn-outline-primary">
										<i class="bi bi-pencil"></i> 修正
									</a>
									<a th:href="@{/book/{id}/delete(id=${book.id})}"
									   class="btn btn-sm btn-outline-danger"
									   onclick="return confirm('この書籍を削除しますか？');">
										<i class="bi bi-trash"></i> 削除
									</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>

			</div>
		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
